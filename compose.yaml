services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    env_file:
      - .env

    volumes:
      - database:/app/data

    ports:
      - "8000:8000"

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  database: